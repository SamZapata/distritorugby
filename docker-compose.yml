services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    # Corre como el usuario del host: evita que los caches (tmp/, log/,
    # storage/) queden con dueño root en el bind mount y rompan los tests/Server
    # nativos. Ajusta APP_UID/APP_GID en .env si tu usuario no es 1000.
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    # db:prepare crea y migra la base la primera vez (y es no-op después).
    command: bash -c "bin/rails db:prepare && rm -f tmp/pids/server.pid && bundle exec rails s -b 0.0.0.0"
    volumes:
      - .:/app
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      RAILS_ENV: development
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:

